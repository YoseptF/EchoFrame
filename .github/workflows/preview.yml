name: Preview

# Every pull request into `release` gets its own URL: a version of the staging Worker served
# under a `pr-<n>` alias. Nothing is deployed; the alias only serves that version.
on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview URL
    # Same-repo branches only (secrets are not available to forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Upload a version under the pr-<n> alias
        id: upload
        run: |
          bunx wrangler versions upload --env staging --preview-alias "pr-$PR" --message "PR #$PR at $SHA"
          account=$(grep -o '"account_id": *"[0-9a-f]*"' wrangler.jsonc | grep -o '[0-9a-f]\{32\}')
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$account/workers/subdomain" | jq -r .result.subdomain)
          echo "url=https://pr-$PR-echoframe-staging.$sub.workers.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR: ${{ github.event.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
      - name: Comment the URL on the PR
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview-url -->'
            const body = `${marker}\nPreview: ${process.env.URL}\n\nBuilt from ${process.env.SHA.slice(0, 7)}.`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body && c.body.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
